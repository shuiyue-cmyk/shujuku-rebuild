<div id="bs-biotracker-settings" class="bs-bt-device theme-retro" data-view="home">
  <div class="bs-bt-hardware-detail bs-bt-metal-corner bs-bt-corner-tl"></div>
  <div class="bs-bt-hardware-detail bs-bt-metal-corner bs-bt-corner-tr"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-tl"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-tr"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-bl"></div>
  <div class="bs-bt-hardware-detail bs-bt-screw bs-bt-screw-br"></div>

  <div class="bs-bt-brand" id="bs-bt-brand">Bastneth Pager</div>

  <div class="bs-bt-screen-shell">
    <div class="bs-bt-screen" id="bs-bt-screen">
      <div class="bs-bt-screen-header">
        <span id="bs-bt-time">--:--</span>
        <span id="bs-bt-title">HOME</span>
        <span id="bs-bt-status-icons" class="bs-bt-status-icons" aria-label="battery status" tabindex="0">
          <svg class="bs-bt-battery-icon" viewBox="0 0 30 14" fill="none" xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">
            <rect x="1" y="1" width="24" height="12" rx="2" stroke="currentColor" stroke-width="2"></rect>
            <rect id="bs-bt-battery-fill" x="4" y="4" width="16" height="6" rx="1" fill="currentColor"></rect>
            <rect x="26" y="4" width="3" height="6" rx="1" fill="currentColor"></rect>
          </svg>
        </span>
      </div>

      <div class="bs-bt-screen-content" id="bs-bt-viewport">
        <section id="bs-bt-view-home" class="bs-bt-view is-active" data-view="home">
          <div class="bs-bt-panel">
            <div class="bs-bt-menu-grid">
              <button class="bs-bt-home-tile" type="button" data-nav-view="track-list">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--track" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">追踪</span>
              </button>
              <button class="bs-bt-home-tile" type="button" data-nav-view="table-view">
                <span class="bs-bt-home-tile__icon bs-bt-home-tile__icon--json" aria-hidden="true"></span>
                <span class="bs-bt-home-tile__label">表格</span>
              </button>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-track-list" class="bs-bt-view" data-view="track-list">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <div id="bs-bt-track-character-list" class="bs-bt-track-character-list"></div>
            </div>

            <div class="settings_section">
              <div class="bs-bt-status-title">最新工具调用</div>
              <div id="bs-bt-track-last-call" class="bs-bt-status-box">尚无数据</div>
            </div>

            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-run" class="menu_button" type="button">立即分析当前对话</button>
            </div>

            <div class="bs-bt-track-list-note">说明：离场角色会以精简状态发送给追踪器；点击仍可查看资料，并可在调试面板手动切回在场。</div>

            <div class="settings_section" hidden>
              <label for="bs-bt-targets">优先追踪角色名（逗号或换行分隔，可留空）</label>
              <input id="bs-bt-targets" class="text_pole" type="text" placeholder="艾莉丝,露比" />
              <small>填写后，追踪器会先检查这些角色的剧情与在场状态；留空则平等追踪全部已注册角色。</small>
            </div>

            <div class="settings_section" hidden>
              <label for="bs-bt-system-prompt">角色提示词 / 异步分析系统提示词</label>
              <textarea id="bs-bt-system-prompt" class="text_pole bs-bt-textarea" rows="10"></textarea>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-track-char" class="bs-bt-view" data-view="track-char">
          <div class="bs-bt-panel">
            <div class="settings_section bs-bt-action-row">
              <button id="bs-bt-track-back" class="menu_button" type="button">返回人物清单</button>
            </div>

            <div class="settings_section">
              <div class="bs-bt-track-dashboard">
                <div class="bs-bt-track-tabs" id="bs-bt-track-tabs">
                  <button type="button" class="bs-bt-track-tab" data-track-tab="overview">概览</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="description">描述</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="pregnancy">妊娠</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="experience">经历</button>
                  <button type="button" class="bs-bt-track-tab" data-track-tab="diary">心情</button>
                </div>
                <div id="bs-bt-track-content" class="bs-bt-track-content"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="bs-bt-view-table-view" class="bs-bt-view" data-view="table-view">
          <div class="bs-bt-panel">
            <div class="settings_section">
              <label for="bs-bt-table-select">选择表格</label>
              <select id="bs-bt-table-select" class="text_pole">
                <option value="">请选择表格</option>
              </select>
            </div>
            <div class="settings_section">
              <div class="bs-bt-status-title" id="bs-bt-table-name">数据库表格</div>
              <div id="bs-bt-table-content" class="bs-bt-table-wrap">尚无表格数据。</div>
            </div>
          </div>
        </section>
      </div>

      <div id="bs-bt-power-off-screen" class="bs-bt-power-off-overlay">
        <div>𓃠<br />~nya</div>
      </div>
    </div>
  </div>

  <div class="bs-bt-physical-buttons">
    <button id="bs-bt-home-button" class="bs-bt-physical-button" type="button" title="HOME" aria-label="HOME">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>
  </div>
</div>
